
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Галерея фотографій</h1>
        <p>Зображення завантажуються під час прокручування сторінки</p>
    </header>

    <main class="gallery">

        <div class="image-card">
            <img data-src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Природа" class="lazy-image">
            <button class="load-btn">Завантажити</button>
        </div>

        <div class="image-card">
            <img data-src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" alt="Гори" class="lazy-image">
            <button class="load-btn">Завантажити</button>
        </div>

        <div class="image-card">
            <img data-src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800" alt="Море" class="lazy-image">
            <button class="load-btn">Завантажити</button>
        </div>

        <div class="image-card">
            <img data-src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800" alt="Схід сонця" class="lazy-image">
            <button class="load-btn">Завантажити</button>
        </div>

        <div class="image-card">
            <img data-src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Ліс" class="lazy-image">
            <button class="load-btn">Завантажити</button>
        </div>

        <div class="image-card">
            <img data-src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800" alt="Гірські вершини" class="lazy-image">
            <button class="load-btn">Завантажити</button>
        </div>

        <div class="image-card">
            <img data-src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800" alt="Озеро" class="lazy-image">
            <button class="load-btn">Завантажити</button>
        </div>

        <div class="image-card">
            <img data-src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=800" alt="Океан" class="lazy-image">
            <button class="load-btn">Завантажити</button>
        </div>

        <div class="image-card">
            <img data-src="https://images.unsplash.com/photo-1511497584788-876760111969?w=800" alt="Дерева" class="lazy-image">
            <button class="load-btn">Завантажити</button>
        </div>

        <div class="image-card">
            <img data-src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=800" alt="Дикі тварини" class="lazy-image">
            <button class="load-btn">Завантажити</button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
